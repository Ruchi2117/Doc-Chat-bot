services:
  - type: web
    name: ruchi-doc-chatbot
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: https://ruchi-doc-chatbot-api.onrender.com

  - type: web
    name: ruchi-doc-chatbot-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://ruchi-doc-chatbot.onrender.com
      - key: AUTO_PREPARE_DOCUMENTS
        value: "false"
      - key: RAG_PROFILE
        value: render
      - key: DOCUMENTS_DIR
        value: documents
      - key: VECTORSTORE_PATH
        value: vectorstore
      - key: CHROMA_COLLECTION
        value: doc_chatbot
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
